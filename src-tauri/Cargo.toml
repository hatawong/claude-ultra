[package]
name = "claude-ultra-manager"
version = "1.1.114"
description = "Claude Ultra Manager"
authors = ["Claude Ultra"]
edition = "2021"

[lib]
name = "claude_ultra_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5.0"
once_cell = "1.19"

# Gateway dependencies
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin projection (safe alternative to manual unsafe Pin)
pin-project = "1"

# Proxy dependencies
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
dashmap = "6"
async-stream = "0.3"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
http = "1"
sha2 = "0.10"
semver = "1"

# HTTP client (BoringSSL) — via claude-ultra-http crate
claude-ultra-http = { path = "../http" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body = "1"
http-body-util = "0.1"
base64 = "0.22"
flate2 = "1"

# Tauri plugins
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
regex = "1"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
internal = ["claude-ultra-http/internal"]
